<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background-color: #E2E8F0; /* outline-variant approximation for grid lines */
        }
        .numpad-key {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            transition: background-color 0.1s;
        }
        .numpad-key:active {
            background-color: #f1f5f9;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "tertiary-container": "#ef9900",
                        "outline-variant": "#bccbb9",
                        "on-error-container": "#93000a",
                        "surface-tint": "#006e2f",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#005321",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#4ae176",
                        "inverse-surface": "#213145",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3d4a3d",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed": "#002109",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#4ae176",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#a6f4b5",
                        "secondary": "#1f6c3a",
                        "on-surface": "#0b1c30",
                        "on-secondary-container": "#24703e",
                        "surface-container-highest": "#d3e4fe",
                        "surface": "#f8f9ff",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary": "#855300",
                        "surface-container": "#e5eeff",
                        "on-secondary-fixed-variant": "#005226",
                        "primary-fixed": "#6bff8f",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#5c3800",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container-low": "#eff4ff",
                        "surface-dim": "#cbdbf5",
                        "secondary-container": "#a4f1b2",
                        "primary-container": "#22c55e",
                        "outline": "#6d7b6c",
                        "surface-bright": "#f8f9ff",
                        "error": "#ba1a1a",
                        "background": "#f8f9ff",
                        "on-background": "#0b1c30",
                        "primary": "#006e2f",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-fixed": "#00210b",
                        "on-primary-container": "#004b1e",
                        "secondary-fixed-dim": "#8bd79b",
                        "on-tertiary-fixed": "#2a1700"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "margin-desktop": "24px",
                        "gutter": "12px",
                        "list-item-gap": "8px"
                    },
                    "fontFamily": {
                        "body-sm-dense": ["Inter"],
                        "title-md": ["Inter"],
                        "display-protein": ["Inter"],
                        "headline-lg": ["Inter"],
                        "numeric-data": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm-dense": ["14px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "display-protein": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "numeric-data": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="w-full max-w-[768px] h-touch-target-min flex justify-between items-center px-margin-mobile bg-surface border-b border-outline-variant sticky top-0 z-50">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-title-md text-title-md font-bold text-primary">Pão Integral</h1>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Bimbo</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[768px] flex-grow flex flex-col pb-32">
<!-- Hero Protein Preview -->
<section class="mt-6 px-margin-mobile">
<div class="bg-surface border border-outline-variant rounded-xl p-6 text-center shadow-sm relative overflow-hidden">
<!-- Background Subtle Gradient Overlay -->
<div class="absolute inset-0 opacity-5 bg-gradient-to-br from-primary to-transparent pointer-events-none"></div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2">RESULTADO ESTIMADO</p>
<div class="flex flex-col items-center">
<span class="font-display-protein text-display-protein text-primary" id="protein-display">15.4g</span>
<span class="font-title-md text-title-md text-primary opacity-80 -mt-1">Proteína</span>
</div>
<div class="mt-4 inline-flex items-center gap-2 px-4 py-1 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-sm text-secondary">local_fire_department</span>
<span class="font-numeric-data text-numeric-data text-secondary" id="calories-display">180 kcal</span>
</div>
</div>
</section>
<!-- Quantity Section -->
<section class="mt-8 px-margin-mobile">
<div class="flex flex-col items-center">
<p class="font-body-sm-dense text-body-sm-dense text-on-surface-variant mb-4">Porção: 2 fatias (50g)</p>
<!-- Main Controls -->
<div class="flex items-center justify-center gap-6 mb-8">
<button class="w-14 h-14 rounded-full border-2 border-primary text-primary flex items-center justify-center hover:bg-primary-container/10 active:scale-90 transition-all" onclick="decrement()">
<span class="material-symbols-outlined text-3xl">remove</span>
</button>
<div class="relative flex flex-col items-center">
<input class="w-24 text-center font-display-protein text-display-protein bg-transparent border-none focus:ring-0 p-0 text-on-background" id="quantity-input" readonly="" type="number" value="1"/>
<div class="h-1 w-12 bg-primary/20 rounded-full mt-1"></div>
</div>
<button class="w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md hover:brightness-110 active:scale-95 transition-all" onclick="increment()">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<!-- Quick Chips -->
<div class="flex flex-wrap justify-center gap-2 mb-8">
<button class="px-5 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary hover:text-on-primary hover:border-primary transition-colors" onclick="setQuantity(0.5)">½</button>
<button class="px-5 py-2 rounded-full border-2 border-primary bg-primary text-on-primary font-label-caps text-label-caps shadow-sm" onclick="setQuantity(1)">1</button>
<button class="px-5 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary hover:text-on-primary hover:border-primary transition-colors" onclick="setQuantity(2)">2</button>
<button class="px-5 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps hover:bg-primary hover:text-on-primary hover:border-primary transition-colors" onclick="setQuantity(3)">3</button>
<button class="px-5 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps flex items-center gap-1 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-sm">edit</span>
                        Personalizado
                    </button>
</div>
</div>
</section>
<!-- Numeric Keypad (Simulated for high-frequency entry) -->
<section class="mt-auto px-2">
<div class="bg-surface-container rounded-t-2xl overflow-hidden border-t border-outline-variant">
<div class="numpad-grid">
<button class="numpad-key font-title-md text-title-md text-on-surface">1</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">2</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">3</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">4</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">5</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">6</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">7</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">8</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">9</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">.</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">0</button>
<button class="numpad-key font-title-md text-title-md text-on-surface">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-surface px-margin-mobile py-4 border-t border-outline-variant flex justify-center z-50">
<button class="w-full max-w-[768px] h-14 bg-primary text-on-primary font-title-md text-title-md font-bold rounded-xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2"><span class="material-symbols-outlined">check_circle</span>Adicionar à Refeição</button>
</div>
<script>
        const quantityInput = document.getElementById('quantity-input');
        const proteinDisplay = document.getElementById('protein-display');
        const caloriesDisplay = document.getElementById('calories-display');

        const baseProtein = 15.4;
        const baseCalories = 180;

        function updateValues() {
            const qty = parseFloat(quantityInput.value) || 0;
            const protein = (qty * baseProtein).toFixed(1);
            const calories = Math.round(qty * baseCalories);
            
            proteinDisplay.innerText = `${protein}g`;
            caloriesDisplay.innerText = `${calories} kcal`;

            // Micro-animation for update
            proteinDisplay.animate([
                { transform: 'scale(1.05)', opacity: 0.8 },
                { transform: 'scale(1)', opacity: 1 }
            ], { duration: 200, easing: 'ease-out' });
        }

        function increment() {
            quantityInput.value = parseFloat(quantityInput.value) + 1;
            updateValues();
        }

        function decrement() {
            if (parseFloat(quantityInput.value) > 0.5) {
                quantityInput.value = parseFloat(quantityInput.value) - 0.5;
                updateValues();
            }
        }

        function setQuantity(val) {
            quantityInput.value = val;
            updateValues();
            
            // Highlight active chip
            document.querySelectorAll('button[onclick^="setQuantity"]').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'border-2', 'border-primary', 'shadow-sm');
                btn.classList.add('border', 'border-outline-variant');
            });
            event.currentTarget.classList.add('bg-primary', 'text-on-primary', 'border-2', 'border-primary', 'shadow-sm');
            event.currentTarget.classList.remove('border', 'border-outline-variant');
        }

        // Add tactile feedback for numpad
        document.querySelectorAll('.numpad-key').forEach(key => {
            key.addEventListener('click', () => {
                const text = key.innerText.trim();
                if (text && !isNaN(text)) {
                    // Logic for custom entry would go here
                }
            });
        });
    </script>
</body></html>
